name: Site

# Rejoue exactement ce que fait Heroku : mêmes commandes, même NODE_ENV.
# Sans cela, une erreur de construction ne se découvre qu'au déploiement.
on:
  push:
    branches: [ master ]
    paths: [ 'site/**', 'noyau/**', 'package.json', 'package-lock.json', 'serve.json', 'Procfile', '.github/workflows/site-build.yml' ]
  pull_request:
    paths: [ 'site/**', 'noyau/**', 'package.json', 'package-lock.json', 'serve.json', 'Procfile', '.github/workflows/site-build.yml' ]
  workflow_dispatch:

jobs:
  construire:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Heroku pose cette variable, et c'est elle qui fait sauter les
      # devDependencies : la reproduire est tout l'intérêt de ce contrôle.
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Garder la compilation Rust d'une exécution à l'autre
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            site/target
          key: site-${{ runner.os }}-${{ hashFiles('site/Cargo.lock', 'site/construire.sh', 'noyau/Cargo.toml') }}
          restore-keys: site-${{ runner.os }}-

      # Deux cibles : le module du navigateur (wasm32) et l'exportateur, qui
      # rend les pages sur la machine. Les tests tournent sur la seconde.
      - name: Vérifier le code Rust (format, clippy, tests)
        working-directory: site
        run: |
          rustup target add wasm32-unknown-unknown
          cargo fmt --check
          cargo clippy --locked --target wasm32-unknown-unknown -- -D warnings
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

      - name: Installer les dépendances de la racine
        run: npm ci

      - name: Construire le site (comme heroku-postbuild)
        run: npm run heroku-postbuild

      - name: Élaguer les dépendances de développement (comme Heroku)
        run: npm prune --omit=dev

      - name: Démarrer le serveur
        run: |
          PORT=3000 npm start &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:3000/ && break
            sleep 1
          done

      - name: Vérifier ce qui est servi
        run: |
          set -e
          echecs=0
          verifie() { # url, code attendu, motif attendu dans les en-têtes ou le corps
            reponse=$(curl -s -o /tmp/corps -w '%{http_code}' "http://localhost:3000$1")
            if [ "$reponse" != "$2" ]; then
              echo "::error::$1 → $reponse au lieu de $2"; echecs=$((echecs+1))
            else
              echo "  ✅ $1 → $reponse"
            fi
          }
          verifie /            200
          verifie /sw.js       200
          verifie /icon.svg    200
          # le module WebAssembly, son chargeur et les styles, nommés avec une empreinte
          for f in site/dist/assets/*; do verifie "/assets/$(basename "$f")" 200; done
          # l'application : la même coquille pour toute adresse /app/…
          verifie /app                       200
          verifie /app/                      200
          verifie /app/heure/quiz/2          200
          verifie /app/journee               200
          verifie /app/sw.js                 200
          verifie /app/manifest.webmanifest  200
          verifie /app/pwa-192.png           200
          # les anciennes adresses, en un seul saut ; le reste n'existe pas
          verifie /presentation 301
          verifie /index.html   301
          verifie /nimporte     404

          echo "— en-têtes de cache —"
          avant=$echecs
          racine=$(curl -s -D- -o /dev/null http://localhost:3000/ | tr -d '\r' | grep -i '^cache-control' | cut -d' ' -f2-)
          [ "$racine" = "no-cache" ] || { echo "::error::la page doit être revalidée, reçu « $racine »"; echecs=$((echecs+1)); }
          for sw in /sw.js /app/sw.js /app/heure/quiz/2; do
            cc=$(curl -s -D- -o /dev/null "http://localhost:3000$sw" | tr -d '\r' | grep -i '^cache-control' | cut -d' ' -f2-)
            [ "$cc" = "no-cache" ] || { echo "::error::$sw doit être revalidé, reçu « $cc »"; echecs=$((echecs+1)); }
          done
          [ "$echecs" -ne "$avant" ] || echo "  ✅ pages et service workers revalidés"

          echo "— WebAssembly —"
          wasm=$(cd site/dist && ls assets/*.wasm | head -1)
          entetes=$(curl -s -D- -o /dev/null "http://localhost:3000/$wasm" | tr -d '\r')
          # Sans ce type, le navigateur refuse la compilation en flux du module.
          echo "$entetes" | grep -qi '^content-type: application/wasm' \
            && echo "  ✅ $wasm servi en application/wasm" \
            || { echo "::error::$wasm n'est pas servi en application/wasm"; echecs=$((echecs+1)); }
          echo "$entetes" | grep -qi '^cache-control: .*immutable' \
            && echo "  ✅ $wasm gardé en cache" \
            || { echo "::error::$wasm devrait être gardé en cache (immutable)"; echecs=$((echecs+1)); }
          grep -q "$wasm" site/dist/index.html \
            && echo "  ✅ la page charge bien ce module" \
            || { echo "::error::index.html ne référence pas $wasm"; echecs=$((echecs+1)); }

          echo "— contenu —"
          # la présentation est rendue en HTML : son contenu est là sans WebAssembly
          if curl -s http://localhost:3000/ | grep -q 'Dix-sept thèmes'; then
            echo "  ✅ la présentation est rendue"
          else
            echo "::error::la présentation ne contient pas ses thèmes"; echecs=$((echecs+1))
          fi
          coquille=$(curl -s http://localhost:3000/app/heure/quiz/2)
          for motif in 'id="app"' 'rel="manifest"' '/app/sw.js' "$wasm"; do
            echo "$coquille" | grep -q -- "$motif" \
              && echo "  ✅ la coquille de l'application contient $motif" \
              || { echo "::error::la coquille de l'application ne contient pas $motif"; echecs=$((echecs+1)); }
          done
          curl -s -D- -o /dev/null http://localhost:3000/app/manifest.webmanifest | tr -d '\r' \
            | grep -qi '^content-type: application/manifest+json' \
            && echo "  ✅ manifeste servi en application/manifest+json" \
            || { echo "::error::le manifeste n'a pas le bon type"; echecs=$((echecs+1)); }

          [ "$echecs" -eq 0 ] || exit 1
