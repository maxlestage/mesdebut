name: iOS TestFlight

# Build signé + envoi sur TestFlight, avec les outils Xcode uniquement
# (xcodebuild + xcrun altool, sans fastlane).
# Déclenché manuellement, ou en poussant un tag « ios-v* » (ex. ios-v1.0.0).
# Nécessite les secrets décrits dans ios/CI.md.
on:
  workflow_dispatch:
  push:
    tags:
      - 'ios-v*'

jobs:
  testflight:
    runs-on: macos-15
    env:
      # Deux jeux de noms sont acceptés : les courts (ASC_*) et les longs,
      # historiques. Le premier défini l'emporte.
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID || secrets.APP_STORE_CONNECT_API_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID || secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
      ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_P8 || secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
      # Obligatoire : la clé API authentifie, mais elle ne désigne pas
      # l'équipe. Sans DEVELOPMENT_TEAM, l'archive échoue sur « Signing for
      # "ReNeuro" requires a development team » — sur les trois cibles.
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Sélectionner Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # Sans ce contrôle, des secrets absents produisent une erreur obscure de
      # xcodebuild (« -authenticationKeyID is required ») trois étapes plus loin.
      - name: Vérifier les secrets App Store Connect
        run: |
          manquants=()
          [ -n "$ASC_KEY_ID" ]      || manquants+=("ASC_KEY_ID")
          [ -n "$ASC_ISSUER_ID" ]   || manquants+=("ASC_ISSUER_ID")
          [ -n "$ASC_KEY_CONTENT" ] || manquants+=("ASC_KEY_P8")
          [ -n "$APPLE_TEAM_ID" ]   || manquants+=("APPLE_TEAM_ID")
          if [ ${#manquants[@]} -gt 0 ]; then
            echo "::error::Secrets manquants : ${manquants[*]}"
            echo ""
            echo "L'envoi sur TestFlight a besoin d'une clé API App Store Connect."
            echo "À définir dans Settings → Secrets and variables → Actions :"
            for m in "${manquants[@]}"; do echo "  - $m"; done
            echo ""
            echo ""
            for m in "${manquants[@]}"; do
              case "$m" in
                APPLE_TEAM_ID)
                  echo "APPLE_TEAM_ID : l'identifiant d'équipe, dix caractères"
                  echo "  (ex. 1A2B3C4D5E). Il se lit sur developer.apple.com,"
                  echo "  rubrique Membership — ou en haut à droite d'App Store"
                  echo "  Connect, sous le nom du compte."
                  ;;
              esac
            done
            echo ""
            echo "Marche à suivre détaillée : ios/CI.md"
            exit 1
          fi
          echo "Les quatre secrets sont présents. Équipe : $APPLE_TEAM_ID"

      - name: Installer la clé API App Store Connect
        run: |
          mkdir -p "$HOME/private_keys"
          # altool et xcodebuild cherchent la clé sous ce nom exact
          cle="$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"

          # Le secret peut avoir été collé tel quel (le .p8 est déjà du texte)
          # ou encodé en base64. On accepte les deux plutôt que d'échouer plus
          # loin sur une erreur incompréhensible.
          if printf '%s' "$ASC_KEY_CONTENT" | grep -q 'BEGIN PRIVATE KEY'; then
            echo "Clé fournie en clair."
            printf '%s\n' "$ASC_KEY_CONTENT" > "$cle"
          else
            echo "Clé fournie en base64, décodage."
            printf '%s' "$ASC_KEY_CONTENT" | tr -d '[:space:]' | base64 --decode > "$cle" 2>/dev/null || true
          fi
          chmod 600 "$cle"

          # Un secret mal collé donnerait sinon « -authenticationKeyID is
          # required » ou une erreur de signature, trois étapes plus loin.
          if ! openssl pkey -in "$cle" -noout 2>/dev/null; then
            echo "::error::Le secret ASC_KEY_P8 n'est pas une clé privée exploitable."
            echo ""
            echo "Attendu : le contenu du fichier AuthKey_XXXXXXXXXX.p8 téléchargé"
            echo "depuis App Store Connect (Utilisateurs et accès → Intégrations),"
            echo "collé tel quel — en-têtes BEGIN/END PRIVATE KEY compris — ou"
            echo "encodé en base64."
            exit 1
          fi
          echo "Clé privée valide."

      - name: Archiver
        working-directory: ios/ReNeuro
        run: |
          set -o pipefail
          profils="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"

          archiver() {
            xcodebuild \
              -project ReNeuro.xcodeproj \
              -scheme ReNeuro \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath build/ReNeuro.xcarchive \
              -allowProvisioningUpdates \
              -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
              -authenticationKeyID "$ASC_KEY_ID" \
              -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
              DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
              CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
              archive 2>&1 | tee "$1"
          }

          # Sur une machine neuve, aucun profil n'existe localement :
          # -allowProvisioningUpdates les crée pendant l'archivage. Le graphe de
          # dépendances en référence alors parfois un avant qu'il soit écrit sur
          # le disque, et l'archivage s'arrête sur « Build input file cannot be
          # found: …/Provisioning Profiles/….mobileprovision ». La seconde
          # tentative les trouve en place.
          if ! archiver /tmp/archive-1.log; then
            if grep -q 'Build input file cannot be found' /tmp/archive-1.log \
               && grep -q 'Provisioning Profiles/.*\.mobileprovision' /tmp/archive-1.log; then
              echo "::warning::Profils absents au premier passage — seconde tentative."
              echo "— profils présents sur le disque —"
              ls -1 "$profils" 2>/dev/null || echo "(aucun)"
              sleep 15
              archiver /tmp/archive-2.log
            else
              echo "::error::L'archivage a échoué, et pas sur la création des profils."
              echo "Les erreurs relevées :"
              grep 'error:' /tmp/archive-1.log | sort -u | head -20
              exit 1
            fi
          fi

      - name: Exporter l'IPA
        working-directory: ios/ReNeuro
        run: |
          set -o pipefail
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>destination</key><string>export</string>
          </dict>
          </plist>
          PLIST
          echo "— ExportOptions.plist —"; cat ExportOptions.plist
          xcodebuild -exportArchive \
            -archivePath build/ReNeuro.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/ipa \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Envoyer sur TestFlight
        working-directory: ios/ReNeuro
        run: |
          set -o pipefail
          IPA=$(ls build/ipa/*.ipa | head -1)
          echo "Envoi de $IPA"

          # altool signale certaines erreurs sur sa sortie tout en se terminant
          # avec un code 0 — un envoi refusé passerait alors pour un succès.
          # On juge donc sur ce qu'il écrit, pas sur ce qu'il renvoie.
          code=0
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" 2>&1 | tee /tmp/envoi.log || code=$?

          if [ "$code" -ne 0 ]; then
            echo "::error::altool s'est arrêté avec le code $code."
          elif grep -qE 'ERROR[: ]' /tmp/envoi.log; then
            echo "::error::altool a refusé l'envoi."
            code=1
          elif ! grep -q 'No errors uploading' /tmp/envoi.log; then
            echo "::error::Envoi non confirmé par altool : le message de succès attendu est absent."
            code=1
          fi

          if [ "$code" -ne 0 ]; then
            # L'erreur (12) est de loin la plus courante au premier envoi.
            if grep -q 'Cannot determine the Apple ID from Bundle ID' /tmp/envoi.log; then
              echo ""
              echo "L'app n'existe pas encore dans App Store Connect."
              echo ""
              echo "Le build est pourtant bon : l'archive est signée et l'IPA"
              echo "exporté. Il manque seulement la fiche côté Apple."
              echo ""
              echo "À faire une seule fois, sur appstoreconnect.apple.com :"
              echo "  Mes apps → + → Nouvelle app"
              echo "  Plateforme : iOS"
              echo "  ID de lot  : com.reneuro.ReNeuro"
              echo ""
              echo "Si cet identifiant n'apparaît pas dans la liste, il faut"
              echo "d'abord l'enregistrer sur developer.apple.com, rubrique"
              echo "Identifiers."
            fi
            exit 1
          fi
          echo "Envoi accepté par Apple. Le build apparaîtra dans TestFlight"
          echo "après quelques minutes de traitement."
