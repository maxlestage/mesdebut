name: iOS Build

# Compile l'app iOS à chaque changement (sans signature, sur simulateur).
# Aucun secret requis — sert à détecter tôt les erreurs de compilation.
on:
  push:
    branches: [ master ]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Sélectionner Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Compiler (simulateur, sans signature)
        working-directory: ios/ReNeuro
        run: |
          set -o pipefail
          xcodebuild \
            -project ReNeuro.xcodeproj \
            -scheme ReNeuro \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -resultBundlePath build/Build.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            build

      # xcodebuild n'imprime pas toujours les diagnostics Swift : on les extrait
      # du bundle de résultats pour que l'échec soit lisible directement ici.
      - name: Diagnostics de compilation (en cas d'échec)
        if: failure()
        working-directory: ios/ReNeuro
        run: |
          echo "===== erreurs de compilation ====="
          xcrun xcresulttool get build-results --path build/Build.xcresult 2>/dev/null | head -300 \
            || xcrun xcresulttool get --legacy --path build/Build.xcresult --format json 2>/dev/null | head -c 30000 \
            || echo "(bundle de résultats indisponible)"
