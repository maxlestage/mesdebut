name: iOS Build

# Compile l'app iOS à chaque changement (sans signature, sur simulateur).
# Aucun secret requis — sert à détecter tôt les erreurs de compilation.
on:
  push:
    branches: [ master ]
    paths:
      - 'ios/**'
      - 'noyau/**'
      - '.github/workflows/ios-build.yml'
  pull_request:
    paths:
      - 'ios/**'
      - 'noyau/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Sélectionner Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # Le noyau (noyau/) est en Rust : noyau/xcode.sh le compile pendant le
      # build, pour les architectures des simulateurs.
      - name: Installer les cibles Rust des simulateurs
        run: |
          rustup toolchain install stable --profile minimal \
            --target aarch64-apple-ios-sim --target x86_64-apple-ios --target aarch64-apple-watchos-sim

      # Compile aussi, en dépendance, l'extension widget (activité en direct)
      # et l'app watchOS embarquée.
      - name: Compiler l'app iPhone (simulateur, sans signature)
        working-directory: ios/ReNeuro
        run: |
          set -o pipefail
          xcodebuild \
            -project ReNeuro.xcodeproj \
            -scheme ReNeuro \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -resultBundlePath build/App.xcresult \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      # Le nom de l'app est écrit échappé dans le projet (« \U2023 »), comme
      # Xcode l'écrit lui-même. Lire le projet ne prouve donc pas que le
      # caractère est bien décodé : on lit le Info.plist *produit*, celui dont
      # l'iPhone tire le nom sous l'icône.
      - name: Vérifier le bundle construit
        working-directory: ios/ReNeuro
        run: |
          python3 ../../.github/scripts/verifier-bundle.py \
            build/DerivedData/Build/Products/Debug-iphonesimulator/ReNeuro.app

      # Build dédié de la montre : les erreurs propres à watchOS sont ainsi
      # attribuées directement à la bonne cible.
      - name: Compiler l'app Apple Watch (simulateur, sans signature)
        working-directory: ios/ReNeuro
        run: |
          set -o pipefail
          xcodebuild \
            -project ReNeuro.xcodeproj \
            -scheme ReNeuroWatch \
            -destination 'generic/platform=watchOS Simulator' \
            -configuration Debug \
            -resultBundlePath build/Watch.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            build

      # xcodebuild n'imprime pas toujours les diagnostics Swift : on les extrait
      # des bundles de résultats pour que l'échec soit lisible directement ici.
      - name: Diagnostics de compilation (en cas d'échec)
        if: failure()
        working-directory: ios/ReNeuro
        run: |
          for bundle in build/App.xcresult build/Watch.xcresult; do
            [ -e "$bundle" ] || continue
            echo "===== erreurs de compilation : $bundle ====="
            xcrun xcresulttool get build-results --path "$bundle" 2>/dev/null | head -300 \
              || xcrun xcresulttool get --legacy --path "$bundle" --format json 2>/dev/null | head -c 30000 \
              || echo "(bundle de résultats illisible)"
          done

  # Ne lit que le code source : pas besoin de macOS, facturé dix fois le tarif.
  contraste:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier la lisibilité dans les deux thèmes
        run: python3 .github/scripts/verifier-contraste.py
