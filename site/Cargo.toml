[package]
name = "reneuro-site"
version = "3.0.0"
edition = "2024"
rust-version = "1.90"
description = "ReNeuro sur le web : le site de présentation et l'application, écrits avec Active"
authors = ["Maxime Nathan Lestage"]
publish = false
default-run = "exporter"

# La bibliothèque est compilée deux fois :
# - en WebAssembly (cdylib), c'est le module que chargent les pages ;
# - pour la machine (rlib), c'est elle que l'exportateur utilise pour écrire le
#   HTML des pages, et que les tests exercent.
[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "exporter"
path = "src/bin/exporter.rs"

# Active suit sa branche master ; Cargo.lock fixe le commit utilisé. Pour
# prendre la dernière version : `cargo update -p active`.
[dependencies]
# le noyau commun au web, à l'iPhone et à la montre
reneuro-noyau = { path = "../noyau" }
active = { git = "https://github.com/maxlestage/Active", branch = "master" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
active = { git = "https://github.com/maxlestage/Active", branch = "master", features = ["client"] }
wasm-bindgen = "=0.2.129"
js-sys = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3"
features = [
  "AddEventListenerOptions",
  "CanvasRenderingContext2d",
  "CssStyleDeclaration",
  "Document",
  "DomRect",
  "DomTokenList",
  "Element",
  "Event",
  "EventTarget",
  "HtmlCanvasElement",
  "HtmlElement",
  "ImageData",
  "IntersectionObserver",
  "IntersectionObserverEntry",
  "IntersectionObserverInit",
  "Location",
  "MediaQueryList",
  "Navigator",
  "NodeList",
  "Path2d",
  "Performance",
  "PointerEvent",
  "Storage",
  "Window",
]

# Le module WebAssembly : on préfère un .wasm léger à quelques pour-cent de vitesse.
# « z » donne le plus petit fichier une fois compressé ; wasm-opt n'y gagne plus rien.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
