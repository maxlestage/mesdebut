<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0b14" />
    <meta name="color-scheme" content="dark" />
    <title>ReNeuro — réapprendre les bases, en s'amusant</title>
    <meta
      name="description"
      content="ReNeuro est une application de quiz pour réapprendre les bases : les jours, l'heure, le calcul, la planification. Sur iPhone et Apple Watch."
    />
    <meta property="og:title" content="ReNeuro" />
    <meta property="og:description" content="Réapprendre les bases, en s'amusant. 16 thèmes, sur l'iPhone et l'Apple Watch." />
    <meta property="og:type" content="website" />

    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Fraunces:ital,opsz,wght@1,9..144,300..600&display=swap"
    />

    <link data-trunk rel="css" href="styles/site.css" data-target-path="assets" />
    <!-- wasm-opt doit connaître les fonctionnalités que Rust active par défaut sur
         wasm32 (mémoire en bloc, etc.), sans quoi il refuse le module. -->
    <link
      data-trunk
      rel="rust"
      href="Cargo.toml"
      data-bin="reneuro-site"
      data-target-path="assets"
      data-wasm-opt="s"
      data-wasm-opt-params="--enable-bulk-memory --enable-nontrapping-float-to-int --enable-sign-ext --enable-mutable-globals --enable-reference-types --enable-multivalue"
    />
    <link data-trunk rel="copy-file" href="public/icon.svg" />
    <link data-trunk rel="copy-file" href="public/sw.js" />

    <!-- Le rideau ne joue son compte qu'une fois par session : décidé avant le
         premier pixel, pour qu'il ne clignote pas au retour sur la page. -->
    <script>
      try { if (sessionStorage.getItem('reneuro-rideau')) document.documentElement.classList.add('rideau-vu') } catch (e) {}
    </script>
    <noscript><style>#rideau { display: none }</style></noscript>
  </head>
  <body>
    <!-- Le rideau couvre aussi le chargement du .wasm : il est servi avec la page,
         pas par l'application. Si celle-ci ne démarre jamais, il se lève seul
         (animation « secours » de site.css). -->
    <div id="rideau" aria-hidden="true">
      <div class="rideau-centre">
        <img src="icon.svg" alt="" width="72" height="72" />
        <span class="rideau-nom">ReNeuro</span>
      </div>
      <span class="rideau-compte"></span>
    </div>

    <div class="grain" aria-hidden="true"></div>

    <!-- Contenu de repli, remplacé par l'application dès qu'elle démarre : sans
         JavaScript ou sans WebAssembly, la page dit quand même l'essentiel. -->
    <div id="racine">
      <main class="repli">
        <img src="icon.svg" alt="" width="96" height="96" />
        <h1>ReNeuro</h1>
        <p>Réapprendre les bases, en s'amusant.</p>
        <p>
          Les jours, l'heure, le calcul, les couleurs, organiser sa journée : seize thèmes, en
          questions courtes. Sur l'iPhone et l'Apple Watch. 4,99 € par mois — bientôt sur l'App Store.
        </p>
      </main>
    </div>
  </body>
</html>
