# Spec XcodeGen : le projet Xcode est généré à partir de ce fichier.
# Voir README.md — `brew install xcodegen` puis `xcodegen generate`.
name: MesDebutsAVC

options:
  bundleIdPrefix: com.mesdebutsavc
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: fr
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  MesDebutsAVC:
    type: application
    platform: iOS
    sources:
      - path: MesDebutsAVC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mesdebutsavc.MesDebutsAVC
        PRODUCT_NAME: "$(TARGET_NAME)"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: "YES"
        ENABLE_PREVIEWS: "YES"
        SWIFT_EMIT_LOC_STRINGS: "YES"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # SQLite du système, pour MemoryStore
        OTHER_LDFLAGS: "-lsqlite3"
        # Info.plist généré : nom affiché, écran de lancement, orientation
        INFOPLIST_KEY_CFBundleDisplayName: "Mes débuts AVC"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown"

schemes:
  MesDebutsAVC:
    build:
      targets:
        MesDebutsAVC: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
